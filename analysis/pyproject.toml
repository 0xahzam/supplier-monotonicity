[project]
name = "supplier-monotonicity"
version = "0.1.0"
description = "Interest rate model elasticity: supplier income monotonicity, rate curve repairs, paper figures and formal verification"
readme = "README.md"
authors = [
    { name = "0xahzam", email = "ahzam.main@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "sympy>=1.14",
    "mpmath>=1.3",
    "scipy>=1.14",
    "ruff>=0.14",
]
